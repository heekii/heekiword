name: 📚 Weekly Word Scraper

on:
  schedule:
    # 매주 월요일 오전 10시 (UTC+9 = 금요일 01:00 UTC)
    - cron: '0 1 * * 1'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  scrape-words:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 코드 다운로드
        uses: actions/checkout@v4

      - name: 🐍 Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 라이브러리 설치
        run: |
          cd scripts
          pip install -r requirements.txt

      - name: 🔑 .env 파일 생성
        run: |
          cat > scripts/.env << EOF
          CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}
          GUARDIAN_API_KEY=${{ secrets.GUARDIAN_API_KEY }}
          NYT_API_KEY=${{ secrets.NYT_API_KEY }}
          EOF

      - name: 🚀 단어 수집 스크립트 실행
        run: |
          cd scripts
          python word-scraper.py 2>&1 || echo "스크립트 실행 완료 (에러 무시)"

      - name: 📊 결과 확인
        run: |
          echo "=== 파일 목록 ==="
          ls -la public/ || echo "public 폴더 없음"
          echo "=== words.json 크기 ==="
          wc -l public/words.json || echo "파일 없음"

      - name: 📤 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f "public/words.json" ]; then
            git add public/words.json
            git commit -m "feat: 자동 단어 수집 - $(date +'%Y-%m-%d')" || echo "변경사항 없음"
            git push
            echo "✓ 단어 수집 완료!"
          else
            echo "⚠️  words.json 생성 실패"
            exit 1
          fi
