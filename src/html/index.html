<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeekiWord - 영단어 암기 앱</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎯 HeekiWord</h1>
      <p>쉽고 즐겁게 배우는 영단어</p>
    </header>

    <main>
      <section class="hero">
        <h2>영단어 학습을 시작하세요</h2>
        <div class="button-group">
          <button class="btn btn-primary">학습 시작</button>
          <button class="btn btn-secondary">내 단어장</button>
        </div>
      </section>

      <section class="features">
        <h3>주요 기능</h3>
        <div class="feature-grid">
          <div class="feature-card">
            <span class="icon">🎴</span>
            <h4>플래시카드</h4>
            <p>카드를 넘기며 배우기</p>
          </div>
          <div class="feature-card">
            <span class="icon">🎮</span>
            <h4>퀴즈</h4>
            <p>재미있게 익히기</p>
          </div>
          <div class="feature-card">
            <span class="icon">📊</span>
            <h4>진도 추적</h4>
            <p>학습 현황 확인</p>
          </div>
          <div class="feature-card">
            <span class="icon">⭐</span>
            <h4>즐겨찾기</h4>
            <p>중요한 단어 저장</p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 HeekiWord by heeki</p>
    </footer>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
